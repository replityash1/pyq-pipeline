name: Process PYQ PDF (Parallel)

on:
  workflow_dispatch:
    inputs:
      num_workers:
        description: "Number of parallel workers"
        default: "20"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunks.outputs.matrix }}
      pdf_name: ${{ steps.chunks.outputs.pdf_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 pymupdf
      - name: Determine page chunks
        id: chunks
        env:
          NUM_WORKERS: ${{ github.event.inputs.num_workers }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_INPUT_FOLDER_ID: ${{ secrets.DRIVE_INPUT_FOLDER_ID }}
        run: python -m src.setup_chunks
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-pdf
          path: work/input.pdf
          retention-days: 1

  primer:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Cache HuggingFace Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-marker-models-v1
          
      - name: Download and Cache AI Models
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install marker-pdf pymupdf
          
          # --- THE MISSING STEP: Give the primer the llama.cpp engine ---
          LATEST_TAG=$(curl -s https://api.github.com/repos/ggerganov/llama.cpp/releases/latest | grep '"tag_name"' | awk -F '"' '{print $4}')
          curl -L "https://github.com/ggerganov/llama.cpp/releases/download/$LATEST_TAG/llama-$LATEST_TAG-bin-ubuntu-x64.zip" -o llama.zip
          unzip llama.zip
          sudo find . -name "llama-server" -exec cp {} /usr/local/bin/ \;
          sudo chmod +x /usr/local/bin/llama-server
          # --------------------------------------------------------------
          
          python -c "import fitz; doc = fitz.open(); doc.new_page().insert_text((50, 50), 'Test'); doc.save('dummy.pdf')"
          marker_single dummy.pdf --output_dir dummy_out --force_ocr

  process:
    needs: [setup, primer]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Restore HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-marker-models-v1
          
      - name: Install Local AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install marker-pdf pymupdf
          
      - name: Install llama.cpp Engine
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/ggerganov/llama.cpp/releases/latest | grep '"tag_name"' | awk -F '"' '{print $4}')
          curl -L "https://github.com/ggerganov/llama.cpp/releases/download/$LATEST_TAG/llama-$LATEST_TAG-bin-ubuntu-x64.zip" -o llama.zip
          unzip llama.zip
          sudo find . -name "llama-server" -exec cp {} /usr/local/bin/ \;
          sudo chmod +x /usr/local/bin/llama-server
          
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: source-pdf
          path: work
          
      - name: Process page range locally
        env:
          START_PAGE: ${{ matrix.start_page }}
          END_PAGE: ${{ matrix.end_page }}
          WORKER_ID: ${{ matrix.worker_id }}
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          TORCH_NUM_THREADS: "2"
        run: python -m src.process_chunk
        
      - name: Upload chunk results
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.worker_id }}
          path: work/output
          retention-days: 1

  merge:
    needs: [setup, process]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
          
      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: merged_output
          merge-multiple: true

      - name: Combine Markdown Files
        run: |
          python -c '
          import os, re
          from pathlib import Path

          base_dir = Path("merged_output")
          combined_text = []
          page_dirs = sorted([d for d in base_dir.iterdir() if d.is_dir() and d.name.startswith("page_")])

          for pdir in page_dirs:
              md_files = list(pdir.glob("*.md"))
              if md_files:
                  md_file = md_files[0]
                  content = md_file.read_text(encoding="utf-8")
                  content = re.sub(r"\]\(([^/)]+\.(png|jpg|jpeg))\)", rf"]({pdir.name}/\1)", content)
                  content = re.sub(r"src=[\"\']([^/)]+\.(png|jpg|jpeg))[\"\']", rf"src=\"{pdir.name}/\1\"", content)
                  page_num = int(pdir.name.split("_")[1])
                  combined_text.append(f"## Page {page_num}\n\n" + content)
                  md_file.unlink()

          final_file = base_dir / "Complete_Transcription.md"
          final_file.write_text("\n\n---\n\n".join(combined_text), encoding="utf-8")
          print(f"Successfully combined {len(combined_text)} pages into Complete_Transcription.md!")
          '

      - name: Merge and upload to Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          PDF_NAME: ${{ needs.setup.outputs.pdf_name }}
        run: python -m src.merge_and_upload
