name: Process PDF

on:
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        start_page: [1]
        end_page: [100]
        worker_id: [0]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # marker-pdf 1.x uses PyTorch directly — no llamacpp / surya-ocr
          # server process, works out of the box on CPU GitHub Actions runners.
          pip install \
            "marker-pdf==1.6.2" \
            "pymupdf>=1.24,<2"

      # ── DELETE the old llama-server block ──────────────────────────
      # - name: Install llama-server
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     mkdir -p llama-bin
      #     gh release download --repo ggml-org/llama.cpp \
      #       --pattern '*bin-ubuntu-x64*' --dir llama-bin --clobber
      #     ...
      # ────────────────────────────────────────────────────────────────

      - name: Cache Marker / HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/datalab
          # 1.x downloads different (smaller) models; use a separate cache key
          # so it doesn't collide with any leftover 2.x cache.
          key: marker-1x-models-${{ runner.os }}
          restore-keys: |
            marker-1x-models-

      # The process step itself — no env changes needed,
      # torch device is set inside process_chunk.py via os.environ.setdefault()
      - name: Process chunk
        run: python -m src.process_chunk
        env:
          START_PAGE: ${{ matrix.start_page }}
          END_PAGE: ${{ matrix.end_page }}
          WORKER_ID: ${{ matrix.worker_id }}
